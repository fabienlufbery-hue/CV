name: Deploy ASYt CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build React/Vite for /CV/
        env:
          # Public URL only, never put GEMINI_API_KEY in VITE_* variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://asyt-fabien-voice-api.onrender.com' }}
        run: bun run build -- --base=/CV/

      - name: Check generated site
        run: test -f dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
